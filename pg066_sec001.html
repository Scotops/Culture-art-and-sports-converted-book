      <h1 class="text-[44px] max-lg:text-[38px] max-sm:text-[28px] font-semibold italic leading-[1.15] text-gray-900" data-id="pg066_n0002">How to stretch by lying down and lifting both legs together</h1>

    <div class="mx-auto w-full max-w-4xl px-1 space-y-2 max-sm:space-y-3">
      <div class="grid grid-cols-[2.75rem_1fr] max-sm:grid-cols-[2.25rem_1fr] items-start gap-x-3 max-sm:gap-x-2">
        <p class="text-[28px] max-lg:text-[26px] max-sm:text-[24px] leading-none text-gray-900" data-id="pg066_n0005">1.</p>
        <p class="text-[28px] max-lg:text-[26px] max-sm:text-[24px] italic leading-[1.35] text-gray-900" data-id="pg066_n0006">Sit down.</p>
      </div>
      <div class="grid grid-cols-[2.75rem_1fr] max-sm:grid-cols-[2.25rem_1fr] items-start gap-x-3 max-sm:gap-x-2">
        <p class="text-[28px] max-lg:text-[26px] max-sm:text-[24px] leading-none text-gray-900" data-id="pg066_n0008">2.</p>
        <p class="text-[28px] max-lg:text-[26px] max-sm:text-[24px] italic leading-[1.35] text-gray-900" data-id="pg066_n0009">Lie on your back.</p>
      </div>
      <div class="grid grid-cols-[2.75rem_1fr] max-sm:grid-cols-[2.25rem_1fr] items-start gap-x-3 max-sm:gap-x-2">
        <p class="text-[28px] max-lg:text-[26px] max-sm:text-[24px] leading-none text-gray-900" data-id="pg066_n0011">3.</p>
        <p class="text-[28px] max-lg:text-[26px] max-sm:text-[24px] italic leading-[1.35] text-gray-900" data-id="pg066_n0012">Extend your arms downward.</p>
      </div>
      <div class="grid grid-cols-[2.75rem_1fr] max-sm:grid-cols-[2.25rem_1fr] items-start gap-x-3 max-sm:gap-x-2">
        <p class="text-[28px] max-lg:text-[26px] max-sm:text-[24px] leading-none text-gray-900" data-id="pg066_n0014">4.</p>
        <p class="text-[28px] max-lg:text-[26px] max-sm:text-[24px] italic leading-[1.35] text-gray-900" data-id="pg066_n0015">Lift both legs together.</p>
      </div>
      <div class="grid grid-cols-[2.75rem_1fr] max-sm:grid-cols-[2.25rem_1fr] items-start gap-x-3 max-sm:gap-x-2">

        <p class="text-[28px] max-lg:text-[26px] max-sm:text-[24px] italic leading-[1.35] text-gray-900" data-id="pg066_n0018">Lower your legs and lift them again.</p>

        <p class="text-[28px] max-lg:text-[26px] max-sm:text-[24px] italic leading-[1.35] text-gray-900" data-id="pg066_n0021">Repeat this process five times.</p>
